<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="80" viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MK Shopping logo">
  <!-- White logo variant for dark header background -->
  <g transform="translate(8,8)" fill="#FFFFFF" stroke="#FFFFFF" stroke-linejoin="round">
    <!-- shopping cart icon -->
    <g transform="translate(0,6)" stroke-width="1">
      <rect x="0" y="6" width="58" height="26" rx="4" fill="#FFFFFF" stroke="none" />
      <path d="M6 6 L18 6 L26 0 L52 0" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <circle cx="20" cy="38" r="5" fill="#FFFFFF" stroke="none" />
      <circle cx="46" cy="38" r="5" fill="#FFFFFF" stroke="none" />
    </g>

    <!-- MK Text -->
    <g transform="translate(80,6)">
      <text x="0" y="28" font-family="Georgia, 'Times New Roman', Times, serif" font-size="36" fill="#FFFFFF" font-weight="700">MK</text>
      <text x="0" y="58" font-family="Georgia, 'Times New Roman', Times, serif" font-size="20" fill="#FFFFFF">SHOPPING</text>
    </g>
  </g>
</svg>
